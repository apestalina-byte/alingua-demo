name: StudyBoard checks
on:
  push:
    paths:
      - 'studyboard/**'
      - '.github/workflows/studyboard-backend.yml'
  pull_request:
    paths:
      - 'studyboard/**'
      - '.github/workflows/studyboard-backend.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r studyboard/backend/requirements.txt
      - name: Validate Docker Compose configuration
        working-directory: studyboard/backend
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Compile Python code
        run: python -m compileall -q studyboard/backend/studyboard_backend
      - name: Verify report and input validation logic
        working-directory: studyboard/backend
        run: python -m unittest discover -s tests -v
      - name: Check browser sync syntax
        run: node --check studyboard/sync.js
      - name: Test browser-to-server synchronization
        run: node --test studyboard/tests/sync.test.cjs
